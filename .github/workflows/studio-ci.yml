name: Studio CI and demo render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Validate Next.js dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  render-demo:
    name: Render 9:16 FFmpeg proof of pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render demo MP4
        run: bash scripts/render-demo.sh output/yavuzyigit-studio-demo.mp4
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: yavuzyigit-studio-demo-mp4
          path: output/yavuzyigit-studio-demo.mp4
          if-no-files-found: error
          retention-days: 7
